[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "procdeck"
version = "0.1.0"
description = "Local job runner, process monitor and resource steering for a Windows analysis workstation"
requires-python = ">=3.11"
dependencies = ["psutil>=5.9", "fastapi>=0.110", "uvicorn>=0.29", "pyyaml>=6", "winotify>=1.1"]

[project.optional-dependencies]
test = ["pytest", "httpx"]

[project.scripts]
procdeck = "procdeck.cli:main"

[tool.setuptools]
packages = ["procdeck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
